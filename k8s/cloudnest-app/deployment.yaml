apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnest-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnest-app
  template:
    metadata:
      labels:
        app: cloudnest-app
    spec:
      containers:
      - name: cloudnest-app
        image: 938050482258.dkr.ecr.us-east-1.amazonaws.com/cloudnest-app:latest
        ports:
        - containerPort: 3000
